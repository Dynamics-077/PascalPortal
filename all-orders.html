<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders &mdash; Pascal Press Sales Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <style>
    .stat-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white; border: 1px solid var(--grey-200);
      border-radius: var(--radius-lg); padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
    }
    .stat-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .stat-icon.teal   { background: var(--teal-light); }
    .stat-icon.navy   { background: rgba(30,58,95,.08); }
    .stat-icon.orange { background: var(--orange-light); }
    .stat-icon.green  { background: rgba(34,197,94,.1); }
    .stat-val  { font-size: 1.5rem; font-weight: 700; color: var(--navy); line-height: 1; }
    .stat-lbl  { font-size: .75rem; color: var(--grey-500); margin-top: 3px; }

    .orders-section { margin-bottom: 26px; }
    .orders-section h2 {
      font-size: 1rem; font-weight: 700; color: var(--navy);
      margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
    }
    .orders-section h2 .section-badge {
      background: var(--teal-light); color: var(--teal-dark);
      font-size: .72rem; font-weight: 700; padding: 2px 10px; border-radius: 20px;
    }

    .data-panel {
      background: white; border: 1px solid var(--grey-200);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .panel-head {
      padding: 14px 18px; background: var(--grey-50);
      border-bottom: 1px solid var(--grey-200);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .panel-head h3 { flex: 1; font-size: .95rem; margin: 0; }

    .orders-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .orders-table th {
      background: var(--grey-50); color: var(--grey-600);
      font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--grey-200); white-space: nowrap;
    }
    .orders-table td { padding: 9px 14px; border-bottom: 1px solid var(--grey-100); vertical-align: middle; }
    .orders-table tr:last-child td { border-bottom: none; }
    .orders-table tr:hover td { background: var(--grey-50); }
    .orders-table .mono  { font-family: monospace; font-size: .8rem; }
    .orders-table .id-cell {
      font-family: monospace; font-size: .72rem; color: var(--grey-400);
      font-weight: 600; background: var(--grey-50); padding: 2px 7px;
      border-radius: 6px; border: 1px solid var(--grey-200); white-space: nowrap;
    }
    .orders-table .sales-id { font-family: monospace; font-size: .8rem; color: var(--teal-dark); font-weight: 700; }
    .orders-table .amount  { font-family: monospace; font-weight: 700; color: var(--navy); }

    .lines-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .lines-table th {
      background: var(--grey-50); color: var(--grey-600);
      font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--grey-200); white-space: nowrap;
    }
    .lines-table td { padding: 9px 14px; border-bottom: 1px solid var(--grey-100); vertical-align: middle; }
    .lines-table tr:last-child td { border-bottom: none; }
    .lines-table tr:hover td { background: var(--grey-50); }
    .lines-table .mono  { font-family: monospace; font-size: .8rem; }
    .lines-table .amount { font-family: monospace; font-weight: 700; color: var(--navy); }

    .state-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 20px; color: var(--grey-400); text-align: center;
    }
    .state-box .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .state-box p { font-size: .88rem; max-width: 260px; line-height: 1.6; }
    .state-box .hint { font-size: .76rem; color: var(--grey-300); margin-top: 4px; }

    .error-banner {
      background: var(--danger-bg); border: 1px solid var(--danger);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
      display: none; align-items: flex-start; gap: 10px; font-size: .85rem;
    }
    .error-banner.show { display: flex; }
    .error-banner .msg { color: var(--danger); flex: 1; }

    .table-wrap { overflow-x: auto; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
      opacity: 1; pointer-events: auto;
    }
    .modal-card {
      background: white; border-radius: var(--radius-lg);
      width: 100%; max-width: 900px; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--grey-200);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .modal-title { flex: 1; font-size: 1rem; font-weight: 700; color: var(--navy); margin: 0; }
    .modal-body  { padding: 20px; overflow-y: auto; }
    .modal-footer {
      padding: 12px 20px; border-top: 1px solid var(--grey-200);
      display: flex; justify-content: flex-end; flex-shrink: 0;
    }
    /* confirm-line style matching sales-order review popup */
    .confirm-line {
      display: flex; justify-content: space-between;
      padding: 7px 0; font-size: .88rem; border-bottom: 1px solid var(--grey-100);
    }
    .confirm-line:last-child { border: none; }
    .confirm-line .cl-label { color: var(--grey-600); }
    .confirm-line .cl-val   { font-weight: 600; color: var(--navy); text-align: right; }
    .modal-section-title {
      font-size: .85rem; font-weight: 700; color: var(--navy);
      margin: 18px 0 10px; display: flex; align-items: center; gap: 8px;
      padding-top: 14px; border-top: 1px solid var(--grey-200);
    }
    .modal-section-title .count-chip {
      background: var(--grey-200); color: var(--grey-600);
      font-size: .7rem; padding: 1px 8px; border-radius: 20px;
    }

    @media (max-width: 900px) {
      .stat-strip { grid-template-columns: repeat(2, 1fr); }
    }

    /* Continue Orders section */
    .continue-card {
      background: white; border: 1px solid var(--grey-200);
      border-left: 3px solid var(--orange);
      border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden;
    }
    .continue-card-header {
      padding: 12px 18px; background: var(--grey-50);
      border-bottom: 1px solid var(--grey-200);
      display: flex; align-items: center; gap: 10px;
    }
    .continue-card-header h3 { flex: 1; font-size: .9rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .draft-order-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px; border-bottom: 1px solid var(--grey-100); font-size: .84rem;
    }
    .draft-order-row:last-child { border-bottom: none; }
    .draft-order-row .do-id   { font-family: monospace; font-weight: 700; color: var(--teal-dark); font-size: .82rem; white-space: nowrap; }
    .draft-order-row .do-cust { flex: 1; color: var(--grey-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .draft-order-row .do-date { font-size: .77rem; color: var(--grey-400); white-space: nowrap; }
    .draft-order-row .do-actions { display: flex; gap: 6px; flex-shrink: 0; }
    @media (max-width: 600px) {
      .draft-order-row { flex-wrap: wrap; }
      .draft-order-row .do-actions { width: 100%; }
      .draft-order-row .do-actions .btn { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="layout">

  <div id="pp-sidebar"></div>

  <main class="main-content">
    <div class="topbar">
      <div class="page-title">
        My Orders
        <span class="breadcrumb">/ SharePoint Lists</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Refresh" onclick="loadAll()"><i class="fas fa-sync-alt"></i></button>
        <a href="sales-order.html" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> New Order</a>
        <a href="dashboard.html"   class="btn btn-ghost btn-sm">&larr; Dashboard</a>
        <div class="topbar-user-chip">
          <div class="tu-avatar" id="topbarAvatar">SR</div>
          <span class="tu-name" id="topbarUserName">Loading&hellip;</span>
        </div>
      </div>
    </div>

    <div class="page-body">

      <div class="error-banner" id="errorBanner">
        <i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i>
        <span class="msg" id="errorMsg"></span>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('errorBanner').classList.remove('show')"><i class="fas fa-times"></i></button>
      </div>

      <div class="stat-strip">
        <div class="stat-card">
          <div class="stat-icon teal"><i class="fas fa-file-invoice" style="color:var(--teal-dark);"></i></div>
          <div><div class="stat-val" id="statHeaders">&mdash;</div><div class="stat-lbl">Total Orders</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange"><i class="fas fa-list-ul" style="color:var(--orange);"></i></div>
          <div><div class="stat-val" id="statLines">&mdash;</div><div class="stat-lbl">Total Lines</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-check-circle" style="color:#16a34a;"></i></div>
          <div><div class="stat-val" id="statSubmitted">&mdash;</div><div class="stat-lbl">Submitted</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon navy"><i class="fas fa-clock" style="color:var(--navy);"></i></div>
          <div><div class="stat-val" id="statPending">&mdash;</div><div class="stat-lbl">In Progress</div></div>
        </div>
      </div>

      <!-- Continue Orders — shown only when In-Progress orders exist -->
      <div id="continueOrdersCard" class="continue-card" style="display:none;">
        <div class="continue-card-header">
          <h3><i class="fas fa-clock" style="color:var(--orange);"></i> Continue Orders</h3>
          <span class="badge" style="background:var(--orange-light);color:var(--orange);font-weight:700;" id="continueOrdersBadge">0</span>
        </div>
        <div id="continueOrdersList"></div>
      </div>

      <div class="orders-section">
        <h2>
          <i class="fas fa-file-invoice" style="color:var(--teal);"></i>
          Orders
          <span class="section-badge" id="headersBadge">Loading&hellip;</span>
        </h2>

        <div class="data-panel">
          <div class="panel-head">
            <h3>My Orders</h3>
            <div class="search-bar" style="width:260px;">
              <span class="search-icon"><i class="fas fa-search"></i></span>
              <input type="text" id="headersSearch" placeholder="Search by Sales ID or customer&hellip;" autocomplete="off" oninput="renderHeaders()" />
            </div>
          </div>
          <div id="headersWrap">
            <div class="state-box">
              <div class="icon"><i class="fas fa-file-invoice" style="color:var(--teal);"></i></div>
              <p>Loading orders&hellip;</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div id="orderModal" class="modal-overlay" style="display:none;" onclick="closeOrderModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <i class="fas fa-file-invoice" style="color:var(--teal); font-size:1.1rem;"></i>
      <h2 class="modal-title" id="modalTitle">Order Detail</h2>
      <button class="icon-btn" onclick="closeOrderModal(null)" title="Close"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeOrderModal(null)">Close</button>
    </div>
  </div>
</div>


<div id="toast-container"></div>
<script src="app.js"></script>
<script src="layout.js"></script>
<script>
var _orders         = [];
var _lines          = [];
var _myEmail        = '';
var _renderedOrders = []; // mirrors the currently visible table rows (sorted/filtered)
var _quoteMap       = {}; // salesId → quoteId for converted quotes

function authHeaders(extra) {
  var token = localStorage.getItem('pp_token');
  var h = token ? { Authorization: 'Bearer ' + token } : {};
  return Object.assign(h, extra || {});
}

function fmt(val) {
  try { return PP.fmtCurrency(val); } catch(x) { return 'A$' + Number(val || 0).toFixed(2); }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/[&]/g, '&amp;').replace(/[<]/g, '&lt;').replace(/[>]/g, '&gt;').replace(/["]/g, '&quot;');
}

function fmtDT(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-AU', {day:'2-digit',month:'short',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('en-AU', {hour:'2-digit',minute:'2-digit',hour12:true});
}

var SC = {
  'In Progress':'badge-open', 'Submitted':'badge-paid', 'Submit':'badge-paid',
  'Complete':'badge-paid',    'Completed':'badge-paid',
  'Cancel':'badge-cancelled', 'Cancelled':'badge-cancelled'
};

document.addEventListener('DOMContentLoaded', function () {
  var token = localStorage.getItem('pp_token');
  fetch('/api/bootstrap', { headers: { Authorization: token ? 'Bearer ' + token : '' } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var rep = data.salesRep || {};
      _myEmail = (rep.email || rep.preferred_username || '').toLowerCase();
      var el;
      el = document.getElementById('userName');   if (el) el.textContent = rep.name || 'Sales Rep';
      el = document.getElementById('userRole');   if (el) el.textContent = rep.territory || 'Sales Rep';
      el = document.getElementById('userAvatar'); if (el) el.textContent = (rep.name || 'SR').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    }).catch(function () {});
  loadAll();

  /* ── View Order click ─────────────────────────────────────────
     Use event delegation on #headersWrap so it survives innerHTML
     replacement. Buttons have data-row-idx="N" (numeric index
     into _renderedOrders) — no string escaping needed at all.    */
  document.getElementById('headersWrap').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-row-idx]');
    if (!btn) return;
    var idx = parseInt(btn.getAttribute('data-row-idx'), 10);
    if (!isNaN(idx)) openOrderDetail(idx);
  });
});

function loadAll() { loadHeaders(); loadLines(); loadQuoteMap(); }

function loadQuoteMap() {
  fetch('/api/quotes', { headers: authHeaders() })
    .then(function(r){ if (!r.ok) return []; return r.json(); })
    .then(function(quotes) {
      _quoteMap = {};
      (quotes || []).forEach(function(q) {
        if (q.convertedOrderId) _quoteMap[q.convertedOrderId] = q.quoteId || q.id;
      });
      renderHeaders(); // re-render to show badges
    })
    .catch(function() {}); // non-critical; silent fail is fine
}

function loadHeaders() {
  document.getElementById('headersBadge').textContent = 'Loading…';
  document.getElementById('headersWrap').innerHTML = '<div class="state-box"><p>Loading orders…</p></div>';
  fetch('/api/salesorders', { headers: authHeaders() })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      _orders = data;
      if (_myEmail) {
        _orders = _orders.filter(function (o) {
          var e2 = (o.userEmail || '').toLowerCase();
          return e2 === '' || e2 === _myEmail;
        });
      }
      renderHeaders();
      renderContinueOrders();
      updateStats();
    })
    .catch(function (err) {
      showError(err.message);
      document.getElementById('headersWrap').innerHTML =
        '<div class="state-box"><p>Failed to load orders</p><p class="hint">' + esc(err.message) + '</p></div>';
      document.getElementById('headersBadge').textContent = 'Error';
    });
}

function loadLines() {
  fetch('/api/orderlines', { headers: authHeaders() })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { _lines = d; updateStats(); })
    .catch(function (err) { _lines = []; showError('Failed to load order lines — View Order totals may be incomplete. ' + (err.message || '')); });
}

function renderContinueOrders() {
  var drafts = _orders.filter(function (o) { return (o.status || o.Status) === 'In Progress'; });
  var card   = document.getElementById('continueOrdersCard');
  if (!drafts.length) { card.style.display = 'none'; return; }
  card.style.display = '';
  document.getElementById('continueOrdersBadge').textContent = drafts.length;
  var list = document.getElementById('continueOrdersList');
  list.innerHTML = '';
  drafts.forEach(function (o) {
    var sid  = esc(o.salesId || o.id || '—');
    var cust = esc(o.customerName || o.custAccount || '—');
    var dt   = o.date ? new Date(o.date).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—';
    var row  = document.createElement('div');
    row.className = 'draft-order-row';
    row.innerHTML =
      '<span class="do-id">' + sid + '</span>' +
      '<span class="do-cust">' + cust + '</span>' +
      '<span class="do-date">' + dt + '</span>' +
      '<div class="do-actions">' +
        '<a href="sales-order.html?resume=' + encodeURIComponent(o.salesId || o.id) + '" class="btn btn-primary btn-sm">' +
          '<i class="fas fa-list-ul"></i> Add Lines</a>' +
        '<a href="sales-order.html?resume=' + encodeURIComponent(o.salesId || o.id) + '&step=1" class="btn btn-ghost btn-sm">' +
          '<i class="fas fa-pencil-alt"></i> Edit Header</a>' +
      '</div>';
    list.appendChild(row);
  });
}

function renderHeaders() {
  var q = (document.getElementById('headersSearch').value || '').toLowerCase();
  var rows = _orders.filter(function (o) {
    if (!q) return true;
    return (String(o.salesId || o.SalesId || '') + (o.customerName || '') + (o.customerId || ''))
      .toLowerCase().indexOf(q) !== -1;
  }).sort(function (a, b) { return (Number(b.id) || 0) - (Number(a.id) || 0); });

  document.getElementById('headersBadge').textContent = rows.length + ' record' + (rows.length !== 1 ? 's' : '');
  var wrap = document.getElementById('headersWrap');

  if (!rows.length) {
    wrap.innerHTML = '<div class="state-box"><p>' +
      (q ? 'No orders match &ldquo;' + esc(q) + '&rdquo;' : 'No orders found.') +
      '</p></div>';
    return;
  }

  _renderedOrders = rows; // save for openOrderDetail lookup by index

  var trs = rows.map(function (o, i) {
    var sid      = o.salesId || o.SalesId || o.id || '—';
    var cust     = o.customerName || o.CustomerName || o.customerId || '—';
    var stat     = o.status || o.Status || 'In Progress';
    var rawT     = o.total || o.Total || 0;
    var tot      = rawT > 0 ? fmt(rawT) : '—';
    var lc       = Array.isArray(o.lines) ? o.lines.length : (o.LineCount || '—');
    var dt       = fmtDT(o.dateTime || o.createdDateTime || '');
    var sc       = SC[stat] || 'badge-open';
    var fromQuote = _quoteMap[sid]
      ? ' <span title="Converted from quote" style="font-size:.68rem;font-weight:700;color:#f97316;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);padding:1px 7px;border-radius:10px;white-space:nowrap;">QUO</span>'
      : '';
    return '<tr>'
      + '<td><span class="sales-id">' + esc(sid) + '</span>' + fromQuote + '</td>'
      + '<td style="font-weight:600;color:var(--navy)">' + esc(cust) + '</td>'
      + '<td><span class="badge ' + sc + '" style="font-size:.72rem">' + esc(stat) + '</span></td>'
      + '<td class="mono" style="font-size:.76rem;white-space:nowrap;color:var(--grey-500)">' + dt + '</td>'
      + '<td class="amount">' + tot + '</td>'
      + '<td style="text-align:center;color:var(--grey-500)">' + esc(String(lc)) + '</td>'
      + '<td>'
      + '<button class="btn btn-primary btn-sm" data-row-idx="' + i + '">'
      +   '<i class="fas fa-eye"></i> View Order</button>'
      + '</td>'
      + '</tr>';
  }).join('');

  wrap.innerHTML = '<div class="table-wrap"><table class="orders-table">'
    + '<thead><tr>'
    + '<th>Sales ID</th><th>Customer</th><th>Status</th>'
    + '<th>Date &amp; Time</th><th>Total</th><th>Lines</th><th></th>'
    + '</tr></thead>'
    + '<tbody>' + trs + '</tbody>'
    + '</table></div>';
}

function openOrderDetail(idx) {
  try {
  var o = _renderedOrders[idx];
  if (!o) { showError('Order not found (index ' + idx + '). Please refresh the page.'); return; }

  var sid  = o.salesId || o.SalesId || o.id || '—';
  var cust = o.customerName || o.CustomerName || o.customerId || '—';
  var acct = o.customerId || o.CustomerAccount || o.custAccount || '—';
  var stat = o.status || o.Status || 'In Progress';
  var rep  = o.userEmail || '—';
  var dt   = fmtDT(o.dateTime || o.createdDateTime || '');
  var sc   = SC[stat] || 'badge-open';

  var orderLines = _lines.filter(function (l) {
    var raw = l.SalesId || l.Title || '';
    return raw.replace(/-L\d+$/, '') === sid || raw === sid;
  }).sort(function (a, b) {
    var na = a.lineNumber != null ? Number(a.lineNumber) : 0;
    var nb = b.lineNumber != null ? Number(b.lineNumber) : 0;
    return na - nb;
  });

  var subtotal   = orderLines.reduce(function (s, l) { return s + Number(l.SalesQty || 0) * Number(l.SalesPrice || 0); }, 0);
  var gst        = subtotal * 0.1;
  var freight    = subtotal > 0 ? (subtotal >= 150 ? 0 : 12.50) : 0;
  var grandTotal = subtotal + gst + freight;
  var totalBooks = orderLines.reduce(function (s, l) { return s + Number(l.SalesQty || 0); }, 0);

  document.getElementById('modalTitle').textContent = 'Order ' + sid;

  var b = '';

  // ── Status + summary strip ────────────────────────────────
  b += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;">';
  b += odKpi('<i class="fas fa-hashtag"></i>', 'Order ID',    '<span style="font-family:monospace;font-size:.95rem;color:var(--teal-dark);font-weight:700">' + esc(sid) + '</span>');
  b += odKpi('<i class="fas fa-tag"></i>',     'Status',      '<span class="badge ' + sc + '">' + esc(stat) + '</span>');
  b += odKpi('<i class="fas fa-book"></i>',    'Total Books', '<span style="font-size:1.1rem;font-weight:700;color:var(--navy)">' + totalBooks + '</span>');
  b += odKpi('<i class="fas fa-receipt"></i>', 'Grand Total', '<span style="font-size:1.1rem;font-weight:700;color:var(--teal)">' + fmt(grandTotal) + '</span>');
  b += '</div>';

  // ── Order info grid ───────────────────────────────────────
  b += '<div style="background:var(--grey-50);border:1px solid var(--grey-200);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;">';
  b += '<div style="font-size:.75rem;font-weight:700;color:var(--grey-500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;">'
     + '<i class="fas fa-info-circle" style="color:var(--teal);margin-right:6px;"></i>Order Details</div>';
  b += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;">';
  b += odRow('Customer',           esc(cust));
  b += odRow('Account #',          '<span style="font-family:monospace;color:var(--teal-dark)">' + esc(acct) + '</span>');
  b += odRow('Sales Rep',          esc(rep));
  b += odRow('Date &amp; Time',    dt);
  b += odRow('Line Count',         orderLines.length + ' product' + (orderLines.length !== 1 ? 's' : ''));
  b += '</div></div>';

  // ── Financial summary ─────────────────────────────────────
  b += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:18px;align-items:center;">';
  b += '<div style="background:white;border:1px solid var(--grey-200);border-radius:var(--radius);padding:12px 14px;text-align:center;">'
     + '<div style="font-size:.72rem;color:var(--grey-500);margin-bottom:4px;">Subtotal (excl. GST)</div>'
     + '<div style="font-weight:700;color:var(--navy);font-family:monospace">' + fmt(subtotal) + '</div></div>';
  b += '<div style="background:white;border:1px solid var(--grey-200);border-radius:var(--radius);padding:12px 14px;text-align:center;">'
     + '<div style="font-size:.72rem;color:var(--grey-500);margin-bottom:4px;">GST (10%)</div>'
     + '<div style="font-weight:700;color:var(--navy);font-family:monospace">' + fmt(gst) + '</div></div>';
  b += '<div style="background:white;border:1px solid var(--grey-200);border-radius:var(--radius);padding:12px 14px;text-align:center;">'
     + '<div style="font-size:.72rem;color:var(--grey-500);margin-bottom:4px;">Freight</div>'
     + '<div style="font-weight:700;color:var(--navy);font-family:monospace">' + (freight === 0 && subtotal > 0 ? '<span style="color:#16a34a;font-size:.75rem;">FREE</span>' : fmt(freight)) + '</div></div>';
  b += '<div style="background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-radius:var(--radius);padding:14px 20px;text-align:center;min-width:130px;">'
     + '<div style="font-size:.72rem;color:rgba(255,255,255,.75);margin-bottom:4px;">TOTAL (incl. GST)</div>'
     + '<div style="font-weight:800;color:white;font-family:monospace;font-size:1.15rem">' + fmt(grandTotal) + '</div></div>';
  b += '</div>';

  // ── Order lines ───────────────────────────────────────────
  b += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'
     + '<i class="fas fa-list-ul" style="color:var(--orange)"></i>'
     + '<span style="font-size:.85rem;font-weight:700;color:var(--navy)">Order Lines</span>'
     + '<span style="background:var(--grey-200);color:var(--grey-600);font-size:.7rem;padding:1px 8px;border-radius:20px;">' + orderLines.length + '</span>'
     + '</div>';

  if (orderLines.length === 0) {
    b += '<div style="text-align:center;padding:32px 20px;color:var(--grey-400);background:var(--grey-50);border:1px dashed var(--grey-300);border-radius:var(--radius);">'
       + '<i class="fas fa-box-open" style="font-size:1.8rem;margin-bottom:10px;display:block;color:var(--grey-300)"></i>'
       + '<div style="font-size:.85rem;">No order lines found for this order.</div></div>';
  } else {
    var lineRows = orderLines.map(function (l) {
      var ln  = l.lineNumber != null ? l.lineNumber : '—';
      var ic  = l.ItemCode || '—';
      var inm = l.Title || l.ItemName || l.SearchName || '—';
      var qty = l.SalesQty != null ? l.SalesQty : '—';
      var up  = l.SalesPrice != null ? fmt(Number(l.SalesPrice)) : '—';
      var lt  = (l.SalesQty != null && l.SalesPrice != null) ? fmt(Number(l.SalesQty) * Number(l.SalesPrice)) : '—';
      var un  = l.SalesUnit || 'ea';
      return '<tr>'
        + '<td style="text-align:center;font-weight:600;color:var(--grey-400);font-size:.78rem;">' + esc(String(ln)) + '</td>'
        + '<td><span style="font-family:monospace;font-size:.78rem;background:var(--teal-light);color:var(--teal-dark);padding:2px 7px;border-radius:4px;font-weight:700">' + esc(ic) + '</span></td>'
        + '<td style="font-weight:500;color:var(--navy)">' + esc(inm) + '</td>'
        + '<td style="text-align:right;font-weight:700;color:var(--navy)">' + esc(String(qty)) + '</td>'
        + '<td style="font-size:.76rem;color:var(--grey-500);font-family:monospace">' + esc(un) + '</td>'
        + '<td class="amount">' + up + '</td>'
        + '<td class="amount" style="color:var(--teal-dark)">' + lt + '</td>'
        + '</tr>';
    }).join('');
    b += '<div style="border:1px solid var(--grey-200);border-radius:var(--radius);overflow:hidden;">'
       + '<div class="table-wrap"><table class="lines-table"><thead><tr>'
       + '<th style="width:50px">Line</th><th>Item ID</th><th>Description</th>'
       + '<th style="text-align:right">Qty</th><th>Unit</th><th style="text-align:right">Unit Price</th><th style="text-align:right">Line Total</th>'
       + '</tr></thead><tbody>' + lineRows + '</tbody></table></div></div>';
  }

  document.getElementById('modalBody').innerHTML = b;
  document.getElementById('orderModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  } catch (err) {
    showError('Error opening order: ' + err.message);
    console.error('[ViewOrder]', err);
  }
}

function odKpi(icon, label, val) {
  return '<div style="background:white;border:1px solid var(--grey-200);border-radius:var(--radius);padding:14px 16px;">'
    + '<div style="font-size:.72rem;color:var(--grey-500);margin-bottom:6px;display:flex;align-items:center;gap:5px;">'
    + icon + ' ' + label + '</div>'
    + '<div>' + val + '</div></div>';
}

function odRow(label, val) {
  return '<div style="padding:9px 0;border-bottom:1px solid var(--grey-200);display:flex;flex-direction:column;gap:2px;padding-right:20px;">'
    + '<span style="font-size:.72rem;color:var(--grey-500)">' + label + '</span>'
    + '<span style="font-weight:600;color:var(--navy);font-size:.875rem">' + val + '</span></div>';
}


function closeOrderModal(e) {
  if (e && e.type === 'click' && e.target !== document.getElementById('orderModal')) return;
  document.getElementById('orderModal').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    document.getElementById('orderModal').style.display = 'none';
    document.body.style.overflow = '';
  }
});

function updateStats() {
  document.getElementById('statHeaders').textContent = _orders.length;
  document.getElementById('statLines').textContent   = _lines.length;
  var sub = _orders.filter(function (o) { return ['Submitted','Submit','Complete','Completed'].indexOf(o.status || o.Status) !== -1; }).length;
  var pen = _orders.filter(function (o) { return (o.status || o.Status) === 'In Progress'; }).length;
  document.getElementById('statSubmitted').textContent = sub;
  document.getElementById('statPending').textContent   = pen;
}

function showError(msg) {
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBanner').classList.add('show');
}
</script>
<script src="https://alcdn.msauth.net/browser/2.37.1/js/msal-browser.min.js"></script><script src="pp-auth.js"></script><script src="bot-widget.js"></script>
</body>
